name: setup-vp smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: v1.19.0 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: lts
          cache: true
          cache-save: true
      - name: Verify Vite+
        run: |
          vp --version
          vp run smoke
          echo "setup output: ${{ steps.setup.outputs.version }}"
