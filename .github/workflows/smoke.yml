name: setup-vp smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: v1.19.0 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: lts
          cache: true
          cache-save: true
      - name: Verify Vite+
        run: |
          vp --version
          vp run smoke
          echo "setup output: ${{ steps.setup.outputs.version }}"

  legacy-vite-plus:
    name: v1.19.0 installing Vite+ 0.1.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version: 0.1.11
          node-version: lts
          run-install: false
      - name: Verify Vite+
        run: |
          vp --version
          test "${{ steps.setup.outputs.version }}" = "0.1.11"
